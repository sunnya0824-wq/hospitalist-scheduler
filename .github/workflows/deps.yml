# Temporary: removes the "ci-deps" dependency bundle release that was used
# during development. This workflow file is deleted in the next commit.
name: Remove dependency bundle
on:
  push:
    branches: [generic-scheduler]
    paths: [.github/workflows/deps.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete ci-deps --cleanup-tag --yes || true
